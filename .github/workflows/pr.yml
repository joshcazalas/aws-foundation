name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENTOFU_VERSION: 1.12.5
  TFLINT_VERSION: v0.64.0

jobs:
  fmt:
    name: OpenTofu format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
      - run: tofu fmt -check -recursive terraform

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-repository-hygiene.sh

  validate:
    name: OpenTofu validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap/management-state
          - terraform/github
          - terraform/organization
          - terraform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
      - run: tofu -chdir="${{ matrix.root }}" init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir="${{ matrix.root }}" validate

  tflint:
    name: TFLint (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap/management-state
          - terraform/github
          - terraform/organization
          - terraform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init --config .tflint.hcl
      - run: >-
          tflint --chdir="${{ matrix.root }}"
          --config="${{ github.workspace }}/.tflint.hcl"
          --minimum-failure-severity=warning
