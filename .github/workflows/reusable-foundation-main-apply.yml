name: Reusable main foundation apply

on:
  workflow_call:
    secrets:
      TF_VAR_account_emails:
        description: JSON account-email map required by the organization root.
        required: true

permissions: {}

concurrency:
  group: foundation-main-apply-sequence
  cancel-in-progress: false

jobs:
  reviewed-plan:
    name: Authorize merged reviewed plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      management_state_changes: ${{ steps.validate.outputs.management_state_changes }}
      management_state_digest: ${{ steps.validate.outputs.management_state_digest }}
      organization_changes: ${{ steps.validate.outputs.organization_changes }}
      organization_digest: ${{ steps.validate.outputs.organization_digest }}
      plan_run_id: ${{ steps.authorize.outputs.plan_run_id }}
      platform_changes: ${{ steps.validate.outputs.platform_changes }}
      platform_digest: ${{ steps.validate.outputs.platform_digest }}
      pull_request_number: ${{ steps.authorize.outputs.pull_request_number }}
    steps:
      - name: Check out immutable authorization code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: trusted-automation
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          repository: ${{ job.workflow_repository }}

      - name: Verify immutable authorization checkout
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C trusted-automation rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]] || {
            echo "::error::Authorization code does not match the pinned reusable workflow."
            exit 1
          }

      - name: Resolve immutable merge and plan evidence
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: >-
          python3 trusted-automation/scripts/authorize-foundation-apply.py
          "$GITHUB_OUTPUT"

      - name: Check out the merged main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: joshcazalas/aws-foundation

      - name: Verify source and trusted-workflow ancestry
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "::error::The source checkout does not match merged main."
            exit 1
          }
          git -C source merge-base --is-ancestor "$TRUSTED_WORKFLOW_SHA" "$GITHUB_SHA" || {
            echo "::error::The pinned apply workflow is outside merged main history."
            exit 1
          }

      - name: Download exact sanitized plan metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: reviewed-plan
          pattern: foundation-plan-*
          run-id: ${{ steps.authorize.outputs.plan_run_id }}

      - name: Validate reviewed apply inputs
        id: validate
        run: >-
          python3 trusted-automation/scripts/prepare-foundation-apply.py
          reviewed-plan
          "$GITHUB_OUTPUT"

  apply-management-state:
    name: Apply management state
    needs: reviewed-plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      APPLY_ROLE_ARN: arn:aws:iam::357964519547:role/AWSFoundationManagementStateApply
      EXPECTED_ACCOUNT_ID: '357964519547'
      EXPECTED_CHANGES: ${{ needs.reviewed-plan.outputs.management_state_changes }}
      PULL_REQUEST_NUMBER: ${{ needs.reviewed-plan.outputs.pull_request_number }}
      REQUESTED_ROOT: terraform/bootstrap/management-state
      REVIEWED_PLAN_DIGEST: ${{ needs.reviewed-plan.outputs.management_state_digest }}
      REVIEWED_PLAN_RUN_ID: ${{ needs.reviewed-plan.outputs.plan_run_id }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      - name: Check out merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: joshcazalas/aws-foundation

      - name: Check out immutable apply code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: trusted-automation
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          repository: ${{ job.workflow_repository }}

      - name: Verify source and automation revisions
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C trusted-automation rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]]

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume management-state apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          action-timeout-s: 60
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          aws-region: us-east-1
          retry-max-attempts: 3
          role-duration-seconds: 3600
          role-session-name: foundation-apply-${{ github.run_id }}
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Verify management apply identity
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_ACCOUNT_ID" ]]

      - name: Apply exact reviewed management-state plan
        run: >-
          bash trusted-automation/scripts/run-foundation-apply.sh
          "$GITHUB_WORKSPACE/source"
          "$REQUESTED_ROOT"

  apply-organization:
    name: Apply organization
    needs: [reviewed-plan, apply-management-state]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      APPLY_ROLE_ARN: arn:aws:iam::357964519547:role/AWSFoundationOrganizationApply
      EXPECTED_ACCOUNT_ID: '357964519547'
      EXPECTED_CHANGES: ${{ needs.reviewed-plan.outputs.organization_changes }}
      PULL_REQUEST_NUMBER: ${{ needs.reviewed-plan.outputs.pull_request_number }}
      REQUESTED_ROOT: terraform/organization
      REVIEWED_PLAN_DIGEST: ${{ needs.reviewed-plan.outputs.organization_digest }}
      REVIEWED_PLAN_RUN_ID: ${{ needs.reviewed-plan.outputs.plan_run_id }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_VAR_account_emails: ${{ secrets.TF_VAR_account_emails }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: joshcazalas/aws-foundation

      - name: Check out immutable apply code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: trusted-automation
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          repository: ${{ job.workflow_repository }}

      - name: Verify source and automation revisions
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C trusted-automation rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]]

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume organization apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          action-timeout-s: 60
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          aws-region: us-east-1
          retry-max-attempts: 3
          role-duration-seconds: 3600
          role-session-name: foundation-apply-${{ github.run_id }}
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Verify management apply identity
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_ACCOUNT_ID" ]]

      - name: Apply exact reviewed organization plan
        run: >-
          bash trusted-automation/scripts/run-foundation-apply.sh
          "$GITHUB_WORKSPACE/source"
          "$REQUESTED_ROOT"

  apply-platform:
    name: Apply platform
    needs: [reviewed-plan, apply-organization]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      APPLY_ROLE_ARN: arn:aws:iam::357964519547:role/AWSFoundationPlatformApply
      EXPECTED_ACCOUNT_ID: '357964519547'
      EXPECTED_CHANGES: ${{ needs.reviewed-plan.outputs.platform_changes }}
      PULL_REQUEST_NUMBER: ${{ needs.reviewed-plan.outputs.pull_request_number }}
      REQUESTED_ROOT: terraform/platform
      REVIEWED_PLAN_DIGEST: ${{ needs.reviewed-plan.outputs.platform_digest }}
      REVIEWED_PLAN_RUN_ID: ${{ needs.reviewed-plan.outputs.plan_run_id }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      - name: Check out merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
          ref: ${{ github.sha }}
          repository: joshcazalas/aws-foundation

      - name: Check out immutable apply code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: trusted-automation
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
          repository: ${{ job.workflow_repository }}

      - name: Verify source and automation revisions
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C trusted-automation rev-parse HEAD)" == "$TRUSTED_WORKFLOW_SHA" ]]

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume platform apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          action-timeout-s: 60
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          aws-region: us-east-1
          retry-max-attempts: 3
          role-duration-seconds: 3600
          role-session-name: foundation-apply-${{ github.run_id }}
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Verify management apply identity
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_ACCOUNT_ID" ]]

      - name: Apply exact reviewed platform plan
        run: >-
          bash trusted-automation/scripts/run-foundation-apply.sh
          "$GITHUB_WORKSPACE/source"
          "$REQUESTED_ROOT"
