name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENTOFU_VERSION: 1.12.5
  TFLINT_VERSION: v0.64.0
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  fmt:
    name: OpenTofu format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
      - run: tofu fmt -check -recursive terraform

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-repository-hygiene.sh

  validate:
    name: OpenTofu validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap/management-state
          - terraform/github
          - terraform/organization
          - terraform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
      - run: bash scripts/validate-root.sh "${{ matrix.root }}"

  tflint:
    name: TFLint (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap/management-state
          - terraform/github
          - terraform/organization
          - terraform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init --config .tflint.hcl
      - run: >-
          tflint --chdir="${{ matrix.root }}"
          --config="${{ github.workspace }}/.tflint.hcl"
          --minimum-failure-severity=warning

  workflow-lint:
    name: Workflow and script lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned workflow linters
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"

      - name: Lint workflows and shell scripts
        run: |
          actionlint
          shellcheck scripts/*.sh
          bash -n scripts/*.sh

      - name: Test plan result handling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

  plan:
    name: Trusted plan (${{ matrix.root }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap/management-state
          - terraform/github
          - terraform/organization
          - terraform/platform
    permissions:
      contents: read
      id-token: write
    uses: joshcazalas/aws-foundation/.github/workflows/reusable-foundation-plan.yml@main
    with:
      root: ${{ matrix.root }}
    secrets: inherit

  plan-comment:
    name: Terraform plan comment
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download sanitized plan results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: foundation-plan-*
          path: plan-results
          merge-multiple: true

      - name: Check out trusted comment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Detect live-plan implementation
        id: implementation
        run: |
          if [[ -f trusted/scripts/render-plan-comment.py ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "The trusted main branch is still in identity-only bootstrap mode."
          fi

      - name: Render plan comment
        if: steps.implementation.outputs.available == 'true'
        run: |
          python3 trusted/scripts/render-plan-comment.py \
            "$GITHUB_WORKSPACE/plan-results" \
            "$RUNNER_TEMP/plan-comment.md" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID"

      - name: Publish sticky plan comment
        if: steps.implementation.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash trusted/scripts/publish-plan-comment.sh \
            "$RUNNER_TEMP/plan-comment.md" \
            "$GITHUB_REPOSITORY" \
            "$PULL_REQUEST_NUMBER"
