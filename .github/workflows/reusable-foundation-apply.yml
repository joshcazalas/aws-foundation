name: Reusable foundation apply

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: Merged pull request whose reviewed plan authorizes this apply.
        required: true
        type: number
      reviewed_changes:
        description: Exact sanitized resource/action manifest from the trusted pull-request plan.
        required: true
        type: string
      reviewed_plan_run_id:
        description: Successful trusted pull-request plan run containing the manifest.
        required: true
        type: string
      reviewed_plan_digest:
        description: SHA-256 of the trusted plan's canonical review projection.
        required: true
        type: string
      root:
        description: Approved AWS-backed Terraform root to apply.
        required: true
        type: string
    secrets:
      TF_VAR_account_emails:
        description: JSON account-email map required only by the organization root.
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-apply-${{ inputs.root }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize foundation apply
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce merged pull-request contract
        env:
          CALLER_ACTOR_ID: ${{ github.actor_id }}
          CALLER_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_MERGED: ${{ github.event.pull_request.merged }}
          CALLER_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CALLER_OWNER_ID: ${{ github.repository_owner_id }}
          CALLER_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_ACTOR_ID: '73436834'
          EXPECTED_OWNER_ID: '73436834'
          EXPECTED_REPOSITORY: joshcazalas/aws-foundation
          EXPECTED_REPOSITORY_ID: '1346584597'
          EXPECTED_WORKFLOW_REF: joshcazalas/aws-foundation/.github/workflows/foundation-apply.yml@refs/heads/main
          REQUESTED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
          REQUESTED_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          REQUESTED_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          case "$REQUESTED_ROOT" in
            terraform/bootstrap/management-state|terraform/organization|terraform/platform)
              ;;
            *)
              echo "::error::Unrecognized automatic foundation root: $REQUESTED_ROOT"
              exit 1
              ;;
          esac
          [[ "$CALLER_EVENT" == "pull_request" && "$CALLER_MERGED" == "true" ]] || {
            echo "::error::Foundation apply requires a merged pull-request event."; exit 1;
          }
          [[ "$CALLER_BASE_REF" == "main" && "$CALLER_REF" == "refs/heads/main" ]] || {
            echo "::error::Foundation apply may execute only from merged main."; exit 1;
          }
          [[ "$CALLER_HEAD_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "::error::Fork pull requests cannot authorize foundation apply."; exit 1;
          }
          [[ "$CALLER_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "::error::Unexpected foundation repository."; exit 1;
          }
          [[ "$CALLER_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]] || {
            echo "::error::Immutable repository ID mismatch."; exit 1;
          }
          [[ "$CALLER_OWNER_ID" == "$EXPECTED_OWNER_ID" ]] || {
            echo "::error::Immutable repository owner ID mismatch."; exit 1;
          }
          [[ "$CALLER_WORKFLOW_REF" == "$EXPECTED_WORKFLOW_REF" ]] || {
            echo "::error::Unexpected foundation apply caller workflow."; exit 1;
          }
          [[ "$CALLER_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]] || {
            echo "::error::Only the reviewed repository owner merge may authorize apply."; exit 1;
          }
          [[ "$CALLER_MERGE_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::The event revision does not match the merged main revision."; exit 1;
          }
          [[ "$CALLER_PULL_REQUEST_NUMBER" == "$REQUESTED_PULL_REQUEST_NUMBER" ]] || {
            echo "::error::The reviewed plan pull request does not match this event."; exit 1;
          }
          [[ "$REQUESTED_PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::The reviewed plan run ID is invalid."; exit 1;
          }

  apply:
    name: Apply ${{ inputs.root }}
    needs: authorize
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APPLY_ROLE_ARN: >-
        ${{ inputs.root == 'terraform/bootstrap/management-state'
            && 'arn:aws:iam::357964519547:role/AWSFoundationManagementStateApply'
            || inputs.root == 'terraform/organization'
            && 'arn:aws:iam::357964519547:role/AWSFoundationOrganizationApply'
            || 'arn:aws:iam::357964519547:role/AWSFoundationPlatformApply' }}
      EXPECTED_ACCOUNT_ID: '357964519547'
      EXPECTED_CHANGES: ${{ inputs.reviewed_changes }}
      PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
      REQUESTED_ROOT: ${{ inputs.root }}
      REVIEWED_PLAN_RUN_ID: ${{ inputs.reviewed_plan_run_id }}
      REVIEWED_PLAN_DIGEST: ${{ inputs.reviewed_plan_digest }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_VAR_account_emails: ${{ inputs.root == 'terraform/organization' && secrets.TF_VAR_account_emails || '' }}
    steps:
      - name: Check out the authorized main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "::error::The checked-out revision does not match merged main."; exit 1;
          }

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Assume root-specific foundation apply role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          role-session-name: foundation-apply-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          retry-max-attempts: 3
          action-timeout-s: 60
          unset-current-credentials: true

      - name: Verify management apply identity
        run: |
          set -euo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$caller_account" == "$EXPECTED_ACCOUNT_ID" ]] || {
            echo "::error::Foundation apply resolved to an unexpected AWS account."; exit 1;
          }

      - name: Apply exact reviewed foundation changes
        run: bash scripts/run-foundation-apply.sh "$GITHUB_WORKSPACE" "$REQUESTED_ROOT"
